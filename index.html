<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Chat</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 0 auto; padding: 20px; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .message { margin: 5px 0; padding: 8px; background: #f0f0f0; border-radius: 5px; }
    .sender { font-weight: bold; color: #333; }
    .timestamp { font-size: 0.8em; color: #999; }
    input { width: 100%; padding: 8px; margin: 5px 0; }
    button { padding: 8px 15px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Chat Room</h1>
  <input type="text" id="username" placeholder="Enter your name" />
  <div id="messages"></div>
  <input type="text" id="messageInput" placeholder="Type a message..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    const ws = new WebSocket('ws://localhost:8080');
    const username = document.getElementById('username');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');

    ws.onopen = () => {
      console.log('Connected to server');
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      displayMessage(data);
    };

    ws.onerror = (error) => {
      console.error('WebSocket error:', error);
    };

    ws.onclose = () => {
      console.log('Disconnected from server');
    };

    function sendMessage() {
      if (!username.value.trim() || !messageInput.value.trim()) {
        alert('Please enter a name and message');
        return;
      }

      const message = {
        username: username.value,
        message: messageInput.value
      };

      ws.send(JSON.stringify(message));
      messageInput.value = '';
    }

    function displayMessage(data) {
      const msgElement = document.createElement('div');
      msgElement.className = 'message';
      msgElement.innerHTML = `
        <span class="sender">${data.sender}:</span> ${data.text}
        <div class="timestamp">${new Date(data.timestamp).toLocaleTimeString()}</div>
      `;
      messagesDiv.appendChild(msgElement);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
